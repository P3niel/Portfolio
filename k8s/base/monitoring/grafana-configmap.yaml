apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: portfolio
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: portfolio
data:
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: MLOps
        type: file
        options:
          path: /var/lib/grafana/dashboards
