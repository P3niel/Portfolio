apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

resources:
  - namespace.yaml
  - rbac/serviceaccount.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - mlflow/deployment.yaml
  - mlflow/service.yaml
  - mlflow/pvc.yaml
  - data-pipeline/cronjob.yaml
  # training/job.yaml — run manually: kubectl apply -f k8s/base/training/job.yaml
  - monitoring/prometheus-configmap.yaml
  - monitoring/prometheus-deployment.yaml
  - monitoring/prometheus-service.yaml
  - monitoring/grafana-configmap.yaml
  - monitoring/grafana-deployment.yaml
  - monitoring/grafana-service.yaml
  - monitoring/loki-configmap.yaml
  - monitoring/loki-deployment.yaml
  - monitoring/loki-service.yaml
  # ingress/clusterissuer.yaml — add when domain is available
  # ingress/ingress.yaml      — add when domain is available
