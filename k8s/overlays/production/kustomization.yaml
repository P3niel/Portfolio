apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

resources:
  - ../../base

# Image tags are updated by CI/CD via:
# kustomize edit set image portfolio-api=ghcr.io/<owner>/portfolio-api:<sha>
images:
  - name: portfolio-api
    newName: ghcr.io/p3niel/portfolio-api
    newTag: latest
  - name: portfolio-pipeline
    newName: ghcr.io/p3niel/portfolio-pipeline
    newTag: latest
  - name: portfolio-training
    newName: ghcr.io/p3niel/portfolio-training
    newTag: latest

patches:
  - path: patches/api-limits.yaml
  - path: patches/nodeport-services.yaml
  # - path: patches/ingress-host.yaml  # uncomment when domain is available
