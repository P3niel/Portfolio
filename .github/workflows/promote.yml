name: MLOps — Model Promotion

on:
  workflow_dispatch:

# Manual only while MLflow and k3s are intentionally offline to control costs.

concurrency:
  group: model-promotion
  cancel-in-progress: false

jobs:
  evaluate-and-promote:
    name: Compare & promote model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: training/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt
        working-directory: training

      - name: Run promotion script
        id: promote
        run: python promote.py
        working-directory: training
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_NAME: portfolio-model
        # promote.py must output:  echo "promoted=true" >> $GITHUB_OUTPUT  if a promotion occurred

      - name: Set kubeconfig
        if: steps.promote.outputs.promoted == 'true'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: bash .github/scripts/write-kubeconfig.sh

      - name: Wait for Kubernetes API
        if: steps.promote.outputs.promoted == 'true'
        env:
          RETRY_ATTEMPTS: "6"
          RETRY_SLEEP_SECONDS: "10"
        run: |
          bash .github/scripts/retry.sh \
            kubectl --request-timeout=15s get --raw=/readyz

      - name: Restart API deployment
        if: steps.promote.outputs.promoted == 'true'
        env:
          RETRY_ATTEMPTS: "3"
          RETRY_SLEEP_SECONDS: "15"
        run: |
          bash .github/scripts/retry.sh \
            kubectl rollout restart deployment/api -n portfolio

      - name: Wait for rollout
        if: steps.promote.outputs.promoted == 'true'
        env:
          RETRY_ATTEMPTS: "3"
          RETRY_SLEEP_SECONDS: "15"
        run: |
          bash .github/scripts/retry.sh \
            kubectl rollout status deployment/api -n portfolio --timeout=180s
