name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push Docker images
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set image SHA and lowercase owner
        id: meta
        run: |
          echo "sha=${COMMIT_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio-api:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Pipeline
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/pipeline.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio-pipeline:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Training
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/training.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio-training:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/portfolio-training:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: bash .github/scripts/write-kubeconfig.sh

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin

      - name: Update image tags
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            portfolio-api=ghcr.io/${{ needs.build-push.outputs.owner }}/portfolio-api:${{ needs.build-push.outputs.sha }} \
            portfolio-pipeline=ghcr.io/${{ needs.build-push.outputs.owner }}/portfolio-pipeline:${{ needs.build-push.outputs.sha }} \
            portfolio-training=ghcr.io/${{ needs.build-push.outputs.owner }}/portfolio-training:${{ needs.build-push.outputs.sha }}

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/production/

      - name: Wait for rollout
        run: kubectl rollout status deployment/api -n portfolio --timeout=120s
