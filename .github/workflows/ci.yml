name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-frontend:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript
        run: npx tsc --noEmit
        working-directory: frontend

  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check api/ training/ data_pipeline/
        continue-on-error: false

  test-api:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
        working-directory: api

      - name: Run tests
        run: pytest tests/ -v --tb=short
        working-directory: api
        env:
          # Keep CI deterministic and offline while the shared MLflow service is stopped.
          MLFLOW_TRACKING_URI: "file:///tmp/portfolio-ci-mlruns"
          MODEL_NAME: "portfolio-model"
