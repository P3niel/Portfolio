<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>peniel.dev — terminal (classic)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D;
    --bg-terminal:#111111;
    --green:#00FF9C;
    --green-dim:rgba(0,255,156,.55);
    --gray:#AAAAAA;
    --gray-dim:#6a6a6a;
    --yellow:#FFD166;
    --border:rgba(255,255,255,.06);
    --border-strong:rgba(0,255,156,.25);
    --shadow:0 20px 60px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);min-height:100vh;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--green);}
  body{
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
    background:
      radial-gradient(1000px 500px at 20% -10%, rgba(0,255,156,.04), transparent 60%),
      radial-gradient(800px 400px at 110% 110%, rgba(255,209,102,.03), transparent 60%),
      var(--bg);
    position:relative;overflow-x:hidden;
  }
  /* subtle grain overlay */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity:.35;mix-blend-mode:overlay;
  }
  /* scanline */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:8;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 3px);
  }

  .terminal{
    width:min(1120px, 78vw);
    background:var(--bg-terminal);
    border-radius:8px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
    display:flex;flex-direction:column;
    min-height:640px;
    position:relative;
  }

  .titlebar{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;
    background:linear-gradient(180deg,#151515,#101010);
    border-bottom:1px solid var(--border);
    user-select:none;
  }
  .dots{display:flex;gap:7px}
  .dot{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
  .dot.red{background:#ff5f57}
  .dot.yellow{background:#febc2e}
  .dot.green{background:#28c840}
  .title{
    flex:1;text-align:center;color:var(--gray);
    font-size:12.5px;letter-spacing:.03em;
  }
  .title b{color:#d6d6d6;font-weight:500}
  .status{font-size:11px;color:var(--gray-dim)}
  .status .dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 6px var(--green)}

  .screen{
    padding:22px 26px 26px;
    font-size:14px;line-height:1.65;
    color:var(--green);
    text-shadow:0 0 6px rgba(0,255,156,.12);
    flex:1;
    overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:#333 transparent;
  }
  .screen::-webkit-scrollbar{width:8px}
  .screen::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}

  .line{display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap}
  .prompt{color:var(--green-dim);user-select:none;flex-shrink:0}
  .muted{color:var(--gray)}
  .dim{color:var(--gray-dim)}
  .accent{color:var(--yellow)}
  .ok{color:var(--green)}
  .err{color:#ff6b6b}
  .boot .line{opacity:0;transform:translateY(2px);animation:fadeIn .25s ease forwards}
  @keyframes fadeIn{to{opacity:1;transform:none}}

  .spacer{height:10px}
  .hr{height:1px;background:var(--border);margin:14px 0}

  .welcome{
    font-size:20px;color:#eafff5;margin:8px 0 2px;letter-spacing:.02em;
    text-shadow:0 0 10px rgba(0,255,156,.25);
  }
  .hint{color:var(--gray);font-size:12.5px}

  .cmdbar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .cbtn{
    appearance:none;background:transparent;color:var(--green);
    border:1px solid var(--border-strong);
    border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;
    cursor:pointer;letter-spacing:.02em;
    transition:all .18s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .cbtn .sq{color:var(--gray-dim)}
  .cbtn:hover{
    border-color:var(--green);
    box-shadow:0 0 0 1px rgba(0,255,156,.25), 0 0 18px rgba(0,255,156,.15);
    background:rgba(0,255,156,.04);
  }
  .cbtn:active{transform:translateY(1px)}

  .tree{margin:6px 0 0;color:var(--gray);font-size:13.5px;line-height:1.9}
  .tree .root{color:var(--green)}
  .tree .node{color:var(--gray)}
  .tree .node .name{color:#d8ffe9;cursor:pointer;padding:1px 4px;border-radius:3px}
  .tree .node .name:hover{color:#0D0D0D;background:var(--green)}
  .tree .tag{color:var(--gray-dim);margin-left:10px;font-size:12px}

  /* Project panel */
  .panel{
    margin-top:16px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    padding:18px 20px;
    background:linear-gradient(180deg, rgba(0,255,156,.04), rgba(0,255,156,.01));
    position:relative;
    animation:slideIn .25s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .panel h3{margin:0;font-weight:600;font-size:16px;color:#eafff5;letter-spacing:.02em}
  .panel .close{color:var(--gray-dim);cursor:pointer;font-size:13px;background:none;border:none;font-family:inherit}
  .panel .close:hover{color:var(--yellow)}
  .panel p.desc{color:var(--gray);font-size:13px;margin:6px 0 12px;line-height:1.6}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tag{
    font-size:11.5px;color:var(--yellow);
    border:1px solid rgba(255,209,102,.3);
    padding:2px 8px;border-radius:3px;
    background:rgba(255,209,102,.04);
  }
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .metric{
    border:1px solid var(--border);
    border-radius:6px;padding:10px 12px;background:rgba(255,255,255,.015);
  }
  .metric .k{font-size:11px;color:var(--gray-dim);letter-spacing:.06em;text-transform:uppercase}
  .metric .v{font-size:18px;color:var(--green);margin-top:2px}
  .metric .v.accent{color:var(--yellow)}

  /* Run state */
  .runbox{margin-top:14px;border:1px dashed var(--border-strong);border-radius:6px;padding:12px 14px}
  .runbox .label{color:var(--gray);font-size:12px;margin-bottom:4px}
  .runbox input{
    width:100%;background:transparent;border:none;outline:none;
    color:var(--green);font:inherit;font-size:14px;padding:4px 0;
    caret-color:var(--green);
  }
  .pred{margin-top:10px;color:var(--gray);font-size:13px}
  .pred b{color:var(--yellow)}
  .badge{display:inline-block;padding:1px 8px;border-radius:3px;background:rgba(255,107,107,.1);color:#ff8a8a;border:1px solid rgba(255,107,107,.25);font-size:11.5px;margin-left:6px}
  .badge.ok{background:rgba(0,255,156,.08);color:var(--green);border-color:rgba(0,255,156,.25)}

  /* Input line */
  .input-row{display:flex;align-items:center;gap:10px;padding:10px 26px 16px;border-top:1px solid var(--border);background:#0e0e0e}
  .input-row .prompt{color:var(--green)}
  .input-row input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--green);font:inherit;font-size:14px;
    caret-color:var(--green);
  }
  .cursor{
    display:inline-block;width:8px;height:15px;background:var(--green);
    margin-left:2px;vertical-align:middle;
    animation:blink 1.05s steps(2,start) infinite;
    box-shadow:0 0 8px rgba(0,255,156,.6);
  }
  @keyframes blink{to{opacity:0}}

  /* helper pill */
  .pill{
    display:inline-block;font-size:11px;color:var(--gray);
    padding:2px 8px;border-radius:20px;border:1px solid var(--border);
    margin-left:6px;
  }
</style>
</head>
<body>
<section class="terminal" role="application" aria-label="peniel.dev terminal">
  <div class="titlebar">
    <div class="dots" aria-hidden="true">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    </div>
    <div class="title"><b>peniel.dev</b> — terminal <span class="pill">zsh</span></div>
    <div class="status"><span class="dotlive"></span>online</div>
  </div>

  <div class="screen" id="screen">
    <div class="boot" id="boot"></div>
  </div>

  <div class="input-row">
    <span class="prompt">peniel@devops:~$</span>
    <input id="cli" autocomplete="off" spellcheck="false" aria-label="terminal input" />
    <span class="cursor" aria-hidden="true"></span>
  </div>
</section>

<script>
  const screen = document.getElementById('screen');
  const boot   = document.getElementById('boot');
  const cli    = document.getElementById('cli');

  const bootLines = [
    {t:'> booting system...', cls:'dim'},
    {t:'> loading modules... [kubernetes, prometheus, mlflow]', cls:'dim'},
    {t:'> initializing DevOps environment...', cls:'dim'},
    {t:'> connecting to ML services... <span class="ok">ok</span>', cls:'dim', html:true},
    {t:'> welcome to peniel.dev', cls:'accent'},
  ];

  function mkLine(text, cls='', html=false){
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    const s = document.createElement('span');
    if(html) s.innerHTML = text; else s.textContent = text;
    d.appendChild(s);
    return d;
  }

  // Boot sequence
  let delay = 200;
  bootLines.forEach((l,i)=>{
    setTimeout(()=>{
      const el = mkLine(l.t, l.cls, l.html);
      el.style.animationDelay = '0ms';
      boot.appendChild(el);
      screen.scrollTop = screen.scrollHeight;
      if(i === bootLines.length-1) setTimeout(initIdle, 450);
    }, delay);
    delay += 420;
  });

  function initIdle(){
    const idle = document.createElement('div');
    idle.innerHTML = `
      <div class="hr"></div>
      <div class="welcome">welcome</div>
      <div class="hint">Click a command or type <span class="accent">help</span> to begin. <span class="dim">(new here? try clicking <b>about</b>)</span></div>
      <div class="cmdbar" id="cmdbar">
        <button class="cbtn" data-cmd="about"><span class="sq">[</span>about<span class="sq">]</span></button>
        <button class="cbtn" data-cmd="projects"><span class="sq">[</span>projects<span class="sq">]</span></button>
        <button class="cbtn" data-cmd="skills"><span class="sq">[</span>skills<span class="sq">]</span></button>
        <button class="cbtn" data-cmd="metrics"><span class="sq">[</span>metrics<span class="sq">]</span></button>
        <button class="cbtn" data-cmd="contact"><span class="sq">[</span>contact<span class="sq">]</span></button>
      </div>
    `;
    screen.appendChild(idle);
    bindButtons(idle);
    screen.scrollTop = screen.scrollHeight;
    cli.focus();
  }

  function bindButtons(scope){
    scope.querySelectorAll('[data-cmd]').forEach(b=>{
      b.addEventListener('click', ()=> runCommand(b.dataset.cmd));
    });
  }

  function echo(cmd){
    const row = document.createElement('div');
    row.className = 'line';
    row.innerHTML = `<span class="prompt">peniel@devops:~$</span><span>${cmd}</span>`;
    screen.appendChild(row);
  }

  const projectsMeta = {
    'toxic-ai':{
      title:'toxic-ai',
      desc:'Real-time toxic comment classifier served as a FastAPI microservice. Trained on Jigsaw dataset, shipped via Docker + GitHub Actions, monitored with Prometheus.',
      tags:['FastAPI','Docker','PyTorch','MLflow','GH Actions'],
      metrics:{ requests:'12,480', latency:'120 ms', uptime:'99.94%' }
    },
    'fraud-detection':{
      title:'fraud-detection',
      desc:'Streaming fraud detection pipeline on Kafka + Spark Structured Streaming. XGBoost model re-trained nightly with Airflow.',
      tags:['Kafka','Spark','XGBoost','Airflow','Terraform'],
      metrics:{ requests:'4.2M/day', latency:'38 ms', uptime:'99.99%' }
    },
    'air-quality':{
      title:'air-quality',
      desc:'IoT air-quality forecasting with LSTM + geospatial features. Edge inference on Raspberry Pi, dashboard in Grafana.',
      tags:['TensorFlow','MQTT','Grafana','K3s','Helm'],
      metrics:{ requests:'820/min', latency:'64 ms', uptime:'99.7%' }
    }
  };

  function runCommand(cmd){
    const c = (cmd||'').trim().toLowerCase();
    if(!c) return;
    echo(c);

    if(c === 'help'){
      const html = `
        <div class="line muted">available commands:</div>
        <div class="line muted">  <span class="accent">about</span>      — who I am</div>
        <div class="line muted">  <span class="accent">projects</span>   — explore projects</div>
        <div class="line muted">  <span class="accent">skills</span>     — stack & tools</div>
        <div class="line muted">  <span class="accent">metrics</span>    — live service metrics</div>
        <div class="line muted">  <span class="accent">contact</span>    — get in touch</div>
        <div class="line muted">  <span class="accent">clear</span>      — clear terminal</div>
      `;
      appendBlock(html);
    } else if(c === 'about'){
      appendBlock(`
        <div class="line"><span>peniel — DevOps / MLOps engineer.</span></div>
        <div class="line muted">I design reproducible ML pipelines and keep them boring in production.</div>
        <div class="line dim">based: remote · stack: k8s, terraform, python, go</div>
      `);
    } else if(c === 'skills'){
      appendBlock(`
        <div class="line muted">infra:    <span class="ok">kubernetes · terraform · aws · gcp · helm</span></div>
        <div class="line muted">mlops:    <span class="ok">mlflow · kubeflow · airflow · dvc · bentoml</span></div>
        <div class="line muted">lang:     <span class="ok">python · go · bash · typescript</span></div>
        <div class="line muted">observe:  <span class="ok">prometheus · grafana · loki · opentelemetry</span></div>
      `);
    } else if(c === 'projects'){
      const html = `
        <div class="tree">
          <div class="root">projects/</div>
          <div class="node"> ├── <span class="name" data-open="toxic-ai">toxic-ai</span><span class="tag">NLP · FastAPI</span></div>
          <div class="node"> ├── <span class="name" data-open="fraud-detection">fraud-detection</span><span class="tag">streaming · XGBoost</span></div>
          <div class="node"> └── <span class="name" data-open="air-quality">air-quality</span><span class="tag">IoT · LSTM</span></div>
        </div>
        <div class="line dim" style="margin-top:8px">click a project to open it.</div>
      `;
      const block = appendBlock(html);
      block.querySelectorAll('[data-open]').forEach(n=>{
        n.addEventListener('click', ()=> openProject(n.dataset.open));
      });
    } else if(c.startsWith('open ') || c.startsWith('cd ')){
      const p = c.split(/\s+/)[1];
      if(projectsMeta[p]) openProject(p);
      else appendBlock(`<div class="line err">no such project: ${p}</div>`);
    } else if(c.startsWith('run ')){
      const p = c.split(/\s+/)[1];
      if(projectsMeta[p]) openRun(p);
      else appendBlock(`<div class="line err">cannot run: ${p}</div>`);
    } else if(c === 'metrics'){
      appendBlock(`
        <div class="line muted">API status: <span class="ok">online</span></div>
        <div class="line muted">requests:   <span class="accent">1,240</span></div>
        <div class="line muted">latency:    <span class="accent">120 ms</span></div>
        <div class="line muted">errors:     <span class="accent">0.2%</span></div>
      `);
    } else if(c === 'contact'){
      appendBlock(`
        <div class="line muted">email:   <span class="ok">hi@peniel.dev</span></div>
        <div class="line muted">github:  <span class="ok">github.com/peniel</span></div>
        <div class="line muted">li:      <span class="ok">linkedin.com/in/peniel</span></div>
      `);
    } else if(c === 'clear'){
      screen.innerHTML = '';
      initIdle();
      return;
    } else {
      appendBlock(`<div class="line err">command not found: ${c} — try <span class="accent">help</span></div>`);
    }
    screen.scrollTop = screen.scrollHeight;
  }

  function appendBlock(html){
    const w = document.createElement('div');
    w.innerHTML = html;
    screen.appendChild(w);
    screen.scrollTop = screen.scrollHeight;
    return w;
  }

  function openProject(id){
    const m = projectsMeta[id];
    if(!m) return;
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `
      <header>
        <h3>${m.title}</h3>
        <button class="close" aria-label="close">[ esc ]</button>
      </header>
      <p class="desc">${m.desc}</p>
      <div class="tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="actions">
        <button class="cbtn" data-action="run" data-p="${id}"><span class="sq">[</span>run<span class="sq">]</span></button>
        <button class="cbtn" data-action="github"><span class="sq">[</span>github<span class="sq">]</span></button>
        <button class="cbtn" data-action="architecture"><span class="sq">[</span>architecture<span class="sq">]</span></button>
      </div>
      <div class="metrics">
        <div class="metric"><div class="k">requests served</div><div class="v">${m.metrics.requests}</div></div>
        <div class="metric"><div class="k">latency (p95)</div><div class="v accent">${m.metrics.latency}</div></div>
        <div class="metric"><div class="k">uptime (30d)</div><div class="v">${m.metrics.uptime}</div></div>
      </div>
    `;
    screen.appendChild(panel);
    panel.querySelector('.close').addEventListener('click', ()=> panel.remove());
    panel.querySelectorAll('[data-action]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const act = b.dataset.action;
        if(act === 'run'){ openRun(id); }
        else { appendBlock(`<div class="line muted">→ ${act} link opened for <span class="accent">${id}</span></div>`); }
      });
    });
    screen.scrollTop = screen.scrollHeight;
  }

  function openRun(id){
    echo(`run ${id}`);
    const box = document.createElement('div');
    box.className = 'runbox';
    box.innerHTML = `
      <div class="label">Enter text:</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="prompt">&gt;</span>
        <input type="text" placeholder="type a message and press enter..." />
      </div>
      <div class="pred" style="display:none"></div>
    `;
    screen.appendChild(box);
    const input = box.querySelector('input');
    const pred  = box.querySelector('.pred');
    input.focus();
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter' && input.value.trim()){
        const txt = input.value.trim();
        const score = Math.min(0.99, Math.max(0.05, (txt.length%10)/10 + Math.random()*0.4));
        const toxic = score > 0.5;
        pred.style.display = 'block';
        pred.innerHTML = `prediction: <b>${toxic?'toxic':'non-toxic'}</b> <span class="badge ${toxic?'':'ok'}">${score.toFixed(2)}</span>`;
        input.disabled = true;
        screen.scrollTop = screen.scrollHeight;
      }
    });
  }

  // CLI input
  cli.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      const v = cli.value;
      cli.value = '';
      runCommand(v);
    }
  });
  document.body.addEventListener('click', ()=> cli.focus());
</script>
</body>
</html>
